[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-elo-5000"
version = "0.1.0.dev1"
description = "Independent local chess application and evidence-driven chess laboratory"
requires-python = ">=3.11,<3.16"
dependencies = ["chess==1.11.2", "Flask==3.1.3"]
license = "GPL-3.0-or-later"

[project.scripts]
chess-elo-5000 = "chess_elo_5000.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
